
<div class="material-upload">

  <form id="material-upload-form">
    <div class="material-upload-heading">
      <h4>Upload a textbook</h4>
      <p>Add a PDF to your private learning-material library.</p>
    </div>

    <div class="material-form-grid">
      <div class="field">
        <label for="material-title">Textbook title</label>
        <input id="material-title" type="text"
          placeholder="e.g. Essential Physics" required>
      </div>

      <div class="field">
        <label for="material-subject">Subject</label>
        <input id="material-subject" type="text"
          placeholder="e.g. Physics" required>
      </div>

      <div class="field full">
        <label for="material-topic">Topic (optional)</label>
        <input id="material-topic" type="text"
          placeholder="e.g. Mechanics">
      </div>

      <div class="field full">
        <label for="material-notes">Submission notes (optional)</label>
        <textarea id="material-notes"
          placeholder="Edition, author, or other useful information..."></textarea>
      </div>

      <div class="field full">
        <label for="material-file">PDF document</label>
        <input id="material-file" type="file"
          accept=".pdf,application/pdf" required>
        <p class="upload-note">Maximum file size: 20 MB.</p>
      </div>
    </div>

    <button id="upload-button" class="btn btn-primary" type="submit">
      Upload textbook
    </button>

    <div id="upload-status" role="status" aria-live="polite"></div>
  </form>
</div>

<div class="materials-library-heading">
  <div>
    <h4>Uploaded materials</h4>
    <p>Review uploaded textbooks and manage extraction.</p>
  </div>

  <button id="refresh-materials" class="btn" type="button">
    Refresh
  </button>
</div>

<div id="materials-list" aria-live="polite">
  <div class="empty-list">Loading textbook library...</div>
</div>
