
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAI API Diagnostic</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #10131c;
      color: #f1f3f8;
      padding: 20px;
      line-height: 1.6;
    }

    h2 { color: #8daaff; }

    button {
      background: #5479ed;
      color: white;
      border: 0;
      padding: 13px 18px;
      border-radius: 8px;
      font-size: 16px;
      margin: 12px 0;
    }

    .result {
      background: #1c2230;
      padding: 14px;
      border-radius: 8px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <h2>HAI API Diagnostic</h2>

  <p>
    This page checks communication between
    Hysteria's Cure and the HAI server.
  </p>

  <button onclick="runTests()">Run Diagnostic</button>

  <div id="results"></div>

  <script>
    const API = "https://hai-api-l7js.onrender.com";
    const results = document.getElementById("results");

    function show(title, message) {
      const box = document.createElement("div");
      box.className = "result";

      const heading = document.createElement("strong");
      heading.textContent = title;

      const output = document.createElement("pre");
      output.textContent = message;

      box.append(heading, output);
      results.appendChild(box);
    }

    async function runTests() {
      results.innerHTML = "";

      show("Starting", "Running HAI connection tests...");

      // TEST 1: Health endpoint
      try {
        const response = await fetch(API + "/health");
        const body = await response.text();

        show(
          "TEST 1 — Health",
          "HTTP " + response.status + "\n" + body
        );

      } catch (error) {
        show(
          "TEST 1 — Health FAILED",
          error.name + ": " + error.message
        );
      }

      // TEST 2: Browser-generated CORS preflight
      // The browser automatically sends OPTIONS before this POST.
      try {
        const response = await fetch(
          API + "/textbooks/generate",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer diagnostic-invalid-token"
            },
            body: JSON.stringify({})
          }
        );

        const body = await response.text();

        show(
          "TEST 2 — Authorization and CORS",
          "HTTP " + response.status + "\n\n" +
          "Response:\n" + body +
          "\n\nOrigin: " + location.origin
        );

      } catch (error) {
        show(
          "TEST 2 — Authorization/CORS FAILED",
          error.name + ": " + error.message
        );
      }

      show(
        "Finished",
        "Send me both test results."
      );
    }
  </script>

</body>
</html>
